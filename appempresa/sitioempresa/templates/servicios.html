{% extends "template_main.html" %}
{% block content %}

<header class="tn-detail-header">
  <div class="container">
    <h1>Nuestros servicios</h1>
    <p class="mb-0 fs-5">Soluciones tecnológicas pensadas para pequeñas y medianas empresas.</p>
  </div>
</header>

<section class="container py-5">
    <div class="row g-4">
        {% for item in servicios %}
        <div class="card tn-card p-3 position-relative">
          <div class="tn-icon">{{ item.icon }}</div>
          <h5 class="card-title">{{ item.nombre }}</h5>
          <p class="card-text text-muted">{{item.descripcion_corta}}</p>
          <a href="detalle-1.html" class="stretched-link fw-semibold">Ver detalle &rarr;</a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
